[package]
name = "zfs-prometheus-exporter"
version = "0.1.0"
edition = "2021"
description = "High-performance Prometheus exporter for ZFS metrics"
license = "Apache-2.0"
keywords = ["zfs", "prometheus", "exporter", "monitoring", "metrics"]
categories = ["command-line-utilities", "development-tools::profiling"]
readme = "README.md"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
axum = "0.7"
prometheus-client = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
enum-display = "0.2.1"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
