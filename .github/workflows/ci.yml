name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  CARGO_TERM_COLOR: always

jobs:
  nix-checks:
    name: Nix Checks (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Nix flake
        run: nix flake check --all-systems --show-trace

      - name: Check formatting
        run: nix develop --command cargo fmt -- --check

      - name: Run clippy
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: nix develop --command cargo test --verbose

  build:
    name: Build with Nix
    runs-on: ubuntu-latest
    needs: [ nix-checks ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build with Nix
        run: nix build .#default --print-build-logs

      - name: Check binary
        run: |
          file result/bin/zfs-prometheus-exporter
          ldd result/bin/zfs-prometheus-exporter || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zfs-prometheus-exporter-nix
          path: result/bin/zfs-prometheus-exporter

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download Nix artifact
        uses: actions/download-artifact@v4
        with:
          name: zfs-prometheus-exporter-nix
          path: ./dist

      - name: Create release archive
        run: |
          cd dist
          chmod +x zfs-prometheus-exporter
          tar czf ../zfs-prometheus-exporter-x86_64-linux.tar.gz zfs-prometheus-exporter
          cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            zfs-prometheus-exporter-x86_64-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
